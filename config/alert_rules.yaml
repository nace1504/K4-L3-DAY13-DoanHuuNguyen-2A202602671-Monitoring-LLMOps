alerts:
  - name: HighLatencyP95
    severity: warning
    condition: 'p95(response_sent.latency_ms) > 3000'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: "#k4-l3b-alerts"
    owner: student-2A202602671
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: 'error_rate_pct > 2 or retrieval_success_pct < 90'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: "#k4-l3b-alerts"
    owner: student-2A202602671
    runbook: docs/alerts.md#alert-2
  - name: CostSpike
    severity: warning
    condition: 'sum(cost_usd) per 1h > 2x baseline hourly cost or avg(tokens_out) > 400'
    duration: 10m
    type: symptom-based
    channel: slack
    slack_channel: "#k4-l3b-alerts"
    owner: student-2A202602671
    runbook: docs/alerts.md#alert-3
